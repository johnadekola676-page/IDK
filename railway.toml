[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

[[services]]
name = "telegram-agent"

[services.healthcheck]
path = "/api/health"
# Railway automatically uses the PORT environment variable for healthchecks
# No port configuration needed - Railway will probe the dynamically assigned PORT
initialDelaySeconds = 30
periodSeconds = 30
timeoutSeconds = 10
failureThreshold = 3
