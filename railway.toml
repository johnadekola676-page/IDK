[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "telegram-agent"

[services.healthcheck]
path = "/health"
# Railway automatically uses the PORT environment variable for healthchecks
# No port configuration needed - Railway will probe the dynamically assigned PORT
initialDelaySeconds = 10
periodSeconds = 30
